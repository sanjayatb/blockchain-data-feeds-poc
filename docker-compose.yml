version: "3.9"

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "8545:8545"

  indexer:
    build: .
    depends_on:
      - anvil
    command: ["/app/indexer", "index", "follow", "--config", "/app/configs/config.docker.yaml"]
    volumes:
      - ./configs:/app/configs
      - ./abis:/app/abis
      - ./data:/app/data
    environment:
      - TZ=UTC
